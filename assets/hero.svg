<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="MateMatic - AI that knows what it doesn't know. Four layers: Repertorium, legal knowledge; PATRON, legal workspace; Boutique, connectors and skills; MateMatic, deployment and audit.">
  <!--
    Layout follows the golden section, as on matematicsolutions.com.
    Width: margins 64, gutter 48 outside the split -> (1280 - 128 - 48) = 1104
           major 0.618 * 1104 = 682.3, minor 0.382 * 1104 = 421.7  (ratio 1.618)
    Height: each content block starts at 0.382 of the free vertical space.
    The guides below are invisible; scripts/check_ecosystem.py measures them.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1420"/>
      <stop offset="1" stop-color="#030b17"/>
    </linearGradient>
    <radialGradient id="glow" cx="79%" cy="50%" r="42%">
      <stop offset="0" stop-color="#e3c373" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#e3c373" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#glow)"/>

  <g id="guides" fill="none" stroke="none">
    <rect id="phi-major" x="64" y="88" width="682.3" height="210"/>
    <rect id="phi-minor" x="794.3" y="67" width="421.7" height="264"/>
  </g>

  <!-- major column: statement -->
  <g transform="translate(64 88)">
    <text x="0" y="12" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="2.4" fill="#e3c373">MATEMATIC · EUROPEAN LEGALTECH INFRASTRUCTURE</text>
    <text x="0" y="96" font-family="Fraunces, Charter, Georgia, serif" font-size="56" fill="#dae3f5">AI that <tspan font-style="italic" fill="#f0d080">knows</tspan></text>
    <text x="0" y="160" font-family="Fraunces, Charter, Georgia, serif" font-size="56" fill="#dae3f5">what it doesn&#8217;t know.</text>
    <text x="0" y="206" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8794a8">Legal answers led back to source, context and provenance.</text>
  </g>

  <!-- minor column: the mark as the architecture, gold quadrant bottom-right -->
  <g transform="translate(794.3 67)" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <path d="M 14 0 H 206.85 V 128 H 0 V 14 A 14 14 0 0 1 14 0 Z" fill="#1f3a5f"/>
    <path d="M 214.85 0 H 407.7 A 14 14 0 0 1 421.7 14 V 128 H 214.85 Z" fill="#9aa0a6"/>
    <path d="M 0 136 H 206.85 V 264 H 14 A 14 14 0 0 1 0 250 Z" fill="#6c6f76"/>
    <path d="M 214.85 136 H 421.7 V 250 A 14 14 0 0 1 407.7 264 H 214.85 Z" fill="#d4a73a"/>

    <text x="22" y="84" font-family="Fraunces, Charter, Georgia, serif" font-size="27" fill="#dae3f5">Repertorium</text>
    <text x="22" y="108" font-size="15" fill="#b7c2d4">legal knowledge</text>

    <text x="236.85" y="84" font-family="Fraunces, Charter, Georgia, serif" font-size="27" fill="#030b17">PATRON</text>
    <text x="236.85" y="108" font-size="15" fill="#1a2433">legal workspace</text>

    <text x="22" y="220" font-family="Fraunces, Charter, Georgia, serif" font-size="27" fill="#f5f5f4">Boutique</text>
    <text x="22" y="244" font-size="15" fill="#e4e6ea">connectors &amp; skills</text>

    <text x="236.85" y="220" font-family="Fraunces, Charter, Georgia, serif" font-size="27" fill="#3e2e00">MateMatic</text>
    <text x="236.85" y="244" font-size="15" fill="#3e2e00">deployment &amp; audit</text>
  </g>
</svg>
